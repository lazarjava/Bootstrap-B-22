<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhoneBoook App </title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
      <div class="container">
      <h1><i class="fa fa-phone" style="font-size: 50px;" ></i>PhoneBook App</h1>
      <form id="contact-form">
    <div>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter the name" required />
    </div>
    <br>
    <div>
      <label for="phoneno">Phone Number</label>
      <input type="text" id="phoneno" placeholder="Enter the phone number" required />
    </div>
     <br>
     <br>
    <div class="btn">
      <button type="button" onclick="view()">View Data</button>
      <button type="button" onclick="add()">Add New Data</button>
      <button type="button" onclick="updateData()">Update Data</button>
      <button type="button" onclick="deleteData()">Delete Data</button>
    </div>
  </form>

  
        <div id="view" style="margin-top: 20px;"></div>
        </div>

<script src="script.js"></script>
</body>
</html>
