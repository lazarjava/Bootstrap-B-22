<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build a calculator using Operators & Functions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
                 <div class="container">
                 <h2>Calculator-func</h2>
                 
                 <input type="text" id="num1" name="num1" value=""/>
                 <input type="text" id="num2" name="num2" value=""/><br>
                 <button onclick="add()">+</button>
                 <button onclick="sub()">-</button>
                 <button onclick="mul()">*</button>
                 <button onclick="div()">/</button><br>
                 <button onclick="square()">x<sup>2</sup></button>
                 <button onclick="cube()">x<sup>3</sup></button>
                 <button onclick="Clear()">CE</button>
                 <button onclick="equal()">=</button>
                
                 
                 
                 
                 <h3 id="Result"></h3>

                 <script src="script.js"></script>
                        
                </div>     
                 
</body>
</html>
